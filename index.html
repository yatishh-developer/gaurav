<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gaurav Arts — Gallery</title>
  <style>
    /* ── Reset & base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0d;
      --surface: #1a1a1a;
      --accent: #c9a96e;
      --text: #f0ece4;
      --muted: #888;
      --gap: 12px;
      --radius: 6px;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Georgia', serif;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      text-align: center;
      padding: 56px 24px 32px;
    }

    header h1 {
      font-size: clamp(2rem, 6vw, 3.5rem);
      letter-spacing: 0.08em;
      color: var(--accent);
      font-weight: 400;
    }

    header p {
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.95rem;
      letter-spacing: 0.04em;
    }

    /* ── Status / error bar ── */
    #status {
      text-align: center;
      padding: 12px 24px;
      font-size: 0.9rem;
      color: var(--muted);
      min-height: 40px;
    }

    #status.error { color: #e07070; }

    /* ── Gallery grid ── */
    #gallery {
      columns: 4 220px;
      column-gap: var(--gap);
      padding: var(--gap) clamp(12px, 4vw, 48px) 60px;
    }

    .thumb {
      break-inside: avoid;
      margin-bottom: var(--gap);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: zoom-in;
      position: relative;
      background: var(--surface);
    }

    .thumb img {
      display: block;
      width: 100%;
      height: auto;
      transition: transform 0.35s ease, opacity 0.3s ease;
      opacity: 0;
    }

    .thumb img.loaded { opacity: 1; }

    .thumb:hover img { transform: scale(1.03); }

    .thumb-skeleton {
      width: 100%;
      aspect-ratio: 3/4;
      background: linear-gradient(90deg, var(--surface) 25%, #262626 50%, var(--surface) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: var(--radius);
      margin-bottom: var(--gap);
    }

    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ── Lightbox ── */
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 20px;
    }

    #lightbox.open { display: flex; }

    #lightbox img {
      max-width: min(90vw, 1200px);
      max-height: 85vh;
      border-radius: var(--radius);
      box-shadow: 0 8px 60px rgba(0,0,0,0.7);
      object-fit: contain;
    }

    #lb-caption {
      margin-top: 14px;
      color: var(--muted);
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      max-width: 60ch;
      text-align: center;
      word-break: break-all;
    }

    #lb-close {
      position: fixed;
      top: 20px;
      right: 28px;
      background: none;
      border: none;
      color: var(--text);
      font-size: 2rem;
      cursor: pointer;
      line-height: 1;
      opacity: 0.7;
      transition: opacity 0.2s;
    }
    #lb-close:hover { opacity: 1; }

    #lb-prev, #lb-next {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: var(--text);
      font-size: 1.6rem;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    #lb-prev { left: 16px; }
    #lb-next { right: 16px; }
    #lb-prev:hover, #lb-next:hover { background: rgba(255,255,255,0.18); }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 24px;
      color: var(--muted);
      font-size: 0.8rem;
      border-top: 1px solid #222;
    }
  </style>
</head>
<body>

  <header>
    <h1>Gaurav Arts</h1>
    <p>Photography &amp; Fine Art</p>
  </header>

  <div id="status">Loading gallery…</div>

  <div id="gallery"></div>

  <!-- Lightbox -->
  <div id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer">
    <button id="lb-close" aria-label="Close">&#x2715;</button>
    <button id="lb-prev" aria-label="Previous">&#x2039;</button>
    <img id="lb-img" src="" alt="" />
    <div id="lb-caption"></div>
    <button id="lb-next" aria-label="Next">&#x203a;</button>
  </div>

  <footer>
    &copy; <span id="year"></span> Gaurav Arts. All rights reserved.
  </footer>

  <script type="module">
    /* ═══════════════════════════════════════════════════
       CONFIG — replace these with your actual values
    ═══════════════════════════════════════════════════ */
    const CONFIG = {
      accountId:       'YOUR_CLOUDFLARE_ACCOUNT_ID',   // e.g. 'abc123def456...'
      bucketName:      'YOUR_BUCKET_NAME',              // e.g. 'gaurav-arts'
      accessKeyId:     'YOUR_R2_ACCESS_KEY_ID',
      secretAccessKey: 'YOUR_R2_SECRET_ACCESS_KEY',
      region:          'auto',                          // R2 always uses 'auto'
    };

    // Image extensions to display
    const IMAGE_EXTS = new Set(['jpg','jpeg','png','gif','webp','avif','svg','bmp']);

    const endpoint = `https://${CONFIG.accountId}.r2.cloudflarestorage.com`;

    /* ═══════════════════════════════════════════════════
       AWS Signature V4 helpers (pure browser, no libs)
    ═══════════════════════════════════════════════════ */

    async function hmacSHA256(key, data) {
      const k = typeof key === 'string'
        ? new TextEncoder().encode(key)
        : key;
      const cryptoKey = await crypto.subtle.importKey(
        'raw', k, { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']
      );
      return crypto.subtle.sign('HMAC', cryptoKey, new TextEncoder().encode(data));
    }

    async function sha256Hex(data) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(data));
      return toHex(buf);
    }

    function toHex(buf) {
      return Array.from(new Uint8Array(buf))
        .map(b => b.toString(16).padStart(2, '0'))
        .join('');
    }

    function isoDate(d) {
      return d.toISOString().replace(/[:-]|\.\d{3}/g, '').slice(0, 15) + 'Z';
    }

    function dateStamp(d) {
      return d.toISOString().slice(0, 10).replace(/-/g, '');
    }

    async function getSigningKey(dateStr) {
      const kDate    = await hmacSHA256('AWS4' + CONFIG.secretAccessKey, dateStr);
      const kRegion  = await hmacSHA256(kDate, CONFIG.region);
      const kService = await hmacSHA256(kRegion, 's3');
      return hmacSHA256(kService, 'aws4_request');
    }

    /**
     * Sign a request and return headers ready to pass to fetch().
     */
    async function signRequest({ method, url, headers = {}, body = '' }) {
      const u = new URL(url);
      const now = new Date();
      const amzDate = isoDate(now);
      const dStamp  = dateStamp(now);

      headers['x-amz-date']    = amzDate;
      headers['x-amz-content-sha256'] = await sha256Hex(body);
      headers['host']          = u.host;

      // Canonical headers (sorted)
      const signedHeaderNames = Object.keys(headers).map(h => h.toLowerCase()).sort();
      const canonicalHeaders  = signedHeaderNames
        .map(h => `${h}:${headers[Object.keys(headers).find(k => k.toLowerCase() === h)].trim()}\n`)
        .join('');
      const signedHeadersStr  = signedHeaderNames.join(';');

      // Canonical query string
      const canonicalQS = [...u.searchParams.entries()]
        .sort(([a], [b]) => a < b ? -1 : 1)
        .map(([k, v]) => `${encodeURIComponent(k)}=${encodeURIComponent(v)}`)
        .join('&');

      const canonicalRequest = [
        method,
        u.pathname,
        canonicalQS,
        canonicalHeaders,
        signedHeadersStr,
        headers['x-amz-content-sha256'],
      ].join('\n');

      const credScope = `${dStamp}/${CONFIG.region}/s3/aws4_request`;
      const stringToSign = [
        'AWS4-HMAC-SHA256',
        amzDate,
        credScope,
        await sha256Hex(canonicalRequest),
      ].join('\n');

      const signingKey = await getSigningKey(dStamp);
      const signature  = toHex(await hmacSHA256(signingKey, stringToSign));

      headers['Authorization'] =
        `AWS4-HMAC-SHA256 Credential=${CONFIG.accessKeyId}/${credScope}, ` +
        `SignedHeaders=${signedHeadersStr}, Signature=${signature}`;

      return headers;
    }

    /**
     * Generate a pre-signed GET URL valid for 1 hour.
     */
    async function presignUrl(key) {
      const expires = 3600;
      const now     = new Date();
      const amzDate = isoDate(now);
      const dStamp  = dateStamp(now);
      const credScope = `${dStamp}/${CONFIG.region}/s3/aws4_request`;

      const u = new URL(`${endpoint}/${CONFIG.bucketName}/${encodeURIComponent(key)}`);
      u.searchParams.set('X-Amz-Algorithm',     'AWS4-HMAC-SHA256');
      u.searchParams.set('X-Amz-Credential',    `${CONFIG.accessKeyId}/${credScope}`);
      u.searchParams.set('X-Amz-Date',           amzDate);
      u.searchParams.set('X-Amz-Expires',        String(expires));
      u.searchParams.set('X-Amz-SignedHeaders',  'host');

      const canonicalQS = [...u.searchParams.entries()]
        .sort(([a],[b]) => a < b ? -1 : 1)
        .map(([k,v]) => `${encodeURIComponent(k)}=${encodeURIComponent(v)}`)
        .join('&');

      const canonicalRequest = [
        'GET',
        `/${CONFIG.bucketName}/${encodeURIComponent(key)}`,
        canonicalQS,
        `host:${new URL(endpoint).host}\n`,
        'host',
        'UNSIGNED-PAYLOAD',
      ].join('\n');

      const stringToSign = [
        'AWS4-HMAC-SHA256',
        amzDate,
        credScope,
        await sha256Hex(canonicalRequest),
      ].join('\n');

      const signingKey = await getSigningKey(dStamp);
      const signature  = toHex(await hmacSHA256(signingKey, stringToSign));

      u.searchParams.set('X-Amz-Signature', signature);
      return u.toString();
    }

    /* ═══════════════════════════════════════════════════
       List all objects in the bucket (handles pagination)
    ═══════════════════════════════════════════════════ */
    async function listAllObjects() {
      const keys = [];
      let continuationToken = null;

      do {
        const url = new URL(`${endpoint}/${CONFIG.bucketName}`);
        url.searchParams.set('list-type', '2');
        url.searchParams.set('max-keys',  '1000');
        if (continuationToken) {
          url.searchParams.set('continuation-token', continuationToken);
        }

        const headers = await signRequest({
          method: 'GET',
          url: url.toString(),
        });

        const res = await fetch(url.toString(), { headers });
        if (!res.ok) {
          const txt = await res.text();
          throw new Error(`ListObjects failed: ${res.status} — ${txt}`);
        }

        const xml  = await res.text();
        const parser = new DOMParser();
        const doc  = parser.parseFromString(xml, 'application/xml');

        doc.querySelectorAll('Contents > Key').forEach(el => keys.push(el.textContent));

        const isTruncated = doc.querySelector('IsTruncated')?.textContent === 'true';
        continuationToken = isTruncated
          ? doc.querySelector('NextContinuationToken')?.textContent
          : null;

      } while (continuationToken);

      return keys;
    }

    /* ═══════════════════════════════════════════════════
       Gallery rendering
    ═══════════════════════════════════════════════════ */
    const gallery  = document.getElementById('gallery');
    const status   = document.getElementById('status');
    let imageKeys  = [];   // all image keys
    let imageUrls  = [];   // matching pre-signed URLs
    let lbIndex    = 0;

    function isImage(key) {
      const ext = key.split('.').pop().toLowerCase();
      return IMAGE_EXTS.has(ext);
    }

    function showSkeletons(n = 12) {
      gallery.innerHTML = '';
      for (let i = 0; i < n; i++) {
        const sk = document.createElement('div');
        sk.className = 'thumb-skeleton';
        gallery.appendChild(sk);
      }
    }

    async function buildGallery() {
      showSkeletons();

      let allKeys;
      try {
        allKeys = await listAllObjects();
      } catch (err) {
        status.textContent = `Error: ${err.message}`;
        status.className = 'error';
        gallery.innerHTML = '';
        return;
      }

      imageKeys = allKeys.filter(isImage);

      if (imageKeys.length === 0) {
        status.textContent = 'No images found in the bucket.';
        gallery.innerHTML = '';
        return;
      }

      status.textContent = `Loading ${imageKeys.length} image${imageKeys.length !== 1 ? 's' : ''}…`;
      gallery.innerHTML = '';

      // Generate all pre-signed URLs in parallel
      imageUrls = await Promise.all(imageKeys.map(key => presignUrl(key)));

      imageUrls.forEach((url, idx) => {
        const wrap = document.createElement('div');
        wrap.className = 'thumb';
        wrap.dataset.index = idx;

        const img = document.createElement('img');
        img.alt   = imageKeys[idx].split('/').pop();
        img.loading = 'lazy';
        img.decoding = 'async';
        img.onload  = () => img.classList.add('loaded');
        img.onerror = () => { wrap.style.display = 'none'; };
        img.src = url;

        wrap.appendChild(img);
        wrap.addEventListener('click', () => openLightbox(idx));
        gallery.appendChild(wrap);
      });

      status.textContent = `${imageKeys.length} photo${imageKeys.length !== 1 ? 's' : ''}`;
    }

    /* ═══════════════════════════════════════════════════
       Lightbox
    ═══════════════════════════════════════════════════ */
    const lightbox  = document.getElementById('lightbox');
    const lbImg     = document.getElementById('lb-img');
    const lbCaption = document.getElementById('lb-caption');

    function openLightbox(idx) {
      lbIndex = idx;
      lbImg.src = imageUrls[idx];
      lbImg.alt = imageKeys[idx].split('/').pop();
      lbCaption.textContent = imageKeys[idx].split('/').pop();
      lightbox.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
      lbImg.src = '';
      document.body.style.overflow = '';
    }

    function navigate(dir) {
      lbIndex = (lbIndex + dir + imageUrls.length) % imageUrls.length;
      lbImg.src = imageUrls[lbIndex];
      lbImg.alt = imageKeys[lbIndex].split('/').pop();
      lbCaption.textContent = imageKeys[lbIndex].split('/').pop();
    }

    document.getElementById('lb-close').addEventListener('click', closeLightbox);
    document.getElementById('lb-prev').addEventListener('click', () => navigate(-1));
    document.getElementById('lb-next').addEventListener('click', () => navigate(1));

    lightbox.addEventListener('click', e => {
      if (e.target === lightbox) closeLightbox();
    });

    document.addEventListener('keydown', e => {
      if (!lightbox.classList.contains('open')) return;
      if (e.key === 'Escape')      closeLightbox();
      if (e.key === 'ArrowLeft')   navigate(-1);
      if (e.key === 'ArrowRight')  navigate(1);
    });

    /* ── Boot ── */
    document.getElementById('year').textContent = new Date().getFullYear();
    buildGallery();
  </script>
</body>
</html>
